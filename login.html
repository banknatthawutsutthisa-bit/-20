<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>เข้าสู่ระบบ | NeonGear</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- NeonGear CSS -->
    <link
        rel="stylesheet"
        href="css/login.css">


     

    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav
        class="navbar navbar-expand-lg navbar-dark login-navbar">

        <div class="container">

            <a
                class="navbar-brand"
                href="index.html">

                <i
                    class="bi bi-lightning-charge-fill">
                </i>

                NEONGEAR

            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar">

                <span
                    class="navbar-toggler-icon">
                </span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="mainNavbar">

                <ul
                    class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a
                            class="nav-link px-lg-3"
                            href="index.html">

                            <i
                                class="bi bi-house me-1">
                            </i>

                            หน้าแรก

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link px-lg-3"
                            href="products.html">

                            <i
                                class="bi bi-grid me-1">
                            </i>

                            สินค้า

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link px-lg-3"
                            href="register.html">

                            <i
                                class="bi bi-person-plus me-1">
                            </i>

                            สมัครสมาชิก

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>



    <!-- =====================================================
         LOGIN
    ====================================================== -->

    <main class="login-page">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-12">


                    <div class="login-card">


                        <div class="login-card-body">


                            <!-- LOGO -->

                            <div class="text-center">

                                <div
                                    class="login-logo">

                                    NG

                                </div>


                                <h1
                                    class="login-title">

                                    เข้าสู่<span>ระบบ</span>

                                </h1>


                                <p
                                    class="login-subtitle">

                                    เข้าสู่บัญชี
                                    <strong class="text-info">
                                        NeonGear
                                    </strong>
                                    ของคุณ

                                </p>

                            </div>



                            <!-- =================================================
                                 LOGIN FORM
                            ================================================== -->

                            <form
                                id="loginForm"
                                autocomplete="on">


                                <!-- USERNAME -->

                                <div class="mb-3">

                                    <label
                                        for="loginUsername"
                                        class="form-label">

                                        <i
                                            class="bi bi-person">
                                        </i>

                                        Username หรือ Email

                                    </label>


                                    <input
                                        type="text"
                                        id="loginUsername"
                                        name="username"
                                        class="form-control"
                                        placeholder="กรอก Username หรือ Email"
                                        autocomplete="username"
                                        required>

                                </div>



                                <!-- PASSWORD -->

                                <div class="mb-3">

                                    <label
                                        for="loginPassword"
                                        class="form-label">

                                        <i
                                            class="bi bi-lock-fill">
                                        </i>

                                        Password

                                    </label>


                                    <div
                                        class="input-group login-password-group">

                                        <input
                                            type="password"
                                            id="loginPassword"
                                            name="password"
                                            class="form-control"
                                            placeholder="กรอก Password"
                                            autocomplete="current-password"
                                            required>


                                        <button
                                            type="button"
                                            class="btn"
                                            id="loginPasswordToggle"
                                            aria-label="แสดง Password">

                                            <i
                                                class="bi bi-eye">
                                            </i>

                                        </button>

                                    </div>

                                </div>



                                <!-- REMEMBER -->

                                <div
                                    class="form-check mb-4">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="rememberMe"
                                        name="remember">

                                    <label
                                        class="form-check-label login-remember"
                                        for="rememberMe">

                                        จดจำการเข้าสู่ระบบ

                                    </label>

                                </div>



                                <!-- LOGIN -->

                                <button
                                    type="submit"
                                    class="btn login-submit w-100">

                                    <i
                                        class="bi bi-box-arrow-in-right me-2">
                                    </i>

                                    เข้าสู่ระบบ

                                    <i
                                        class="bi bi-arrow-right ms-1">
                                    </i>

                                </button>


                            </form>



                            <!-- REGISTER -->

                            <div
                                class="text-center mt-4">

                                <span
                                    class="text-secondary small">

                                    ยังไม่มีบัญชี?

                                </span>

                                <a
                                    href="register.html"
                                    class="register-link small ms-1">

                                    สมัครสมาชิก

                                    <i
                                        class="bi bi-arrow-up-right">
                                    </i>

                                </a>

                            </div>



                            <!-- SECURITY -->

                            <div
                                class="login-security">

                                <i
                                    class="bi bi-shield-check me-1">
                                </i>

                                ระบบเข้าสู่ระบบของ NeonGear

                            </div>


                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer
        class="login-footer text-center py-4">

        <small>

            © 2026 NeonGear — Gaming & Computer Store

        </small>

    </footer>



    <!-- =====================================================
         BOOTSTRAP JS
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- =====================================================
         MAIN JS
    ====================================================== -->

    <script src="js/script.js"></script>


    <!-- =====================================================
         AUTH JS
    ====================================================== -->

    <script src="js/auth.js"></script>


    <!-- =====================================================
         PASSWORD TOGGLE
    ====================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const button =
                    document.getElementById(
                        "loginPasswordToggle"
                    );

                const input =
                    document.getElementById(
                        "loginPassword"
                    );


                if (!button || !input) {
                    return;
                }


                button.addEventListener(
                    "click",
                    function () {

                        const icon =
                            button.querySelector("i");


                        if (
                            input.type ===
                            "password"
                        ) {

                            input.type =
                                "text";

                            icon.classList.remove(
                                "bi-eye"
                            );

                            icon.classList.add(
                                "bi-eye-slash"
                            );

                            button.setAttribute(
                                "aria-label",
                                "ซ่อน Password"
                            );

                        } else {

                            input.type =
                                "password";

                            icon.classList.remove(
                                "bi-eye-slash"
                            );

                            icon.classList.add(
                                "bi-eye"
                            );

                            button.setAttribute(
                                "aria-label",
                                "แสดง Password"
                            );

                        }

                    }
                );

            }
        );

    </script>



</body>

</html>
