<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | NeonGear</title>


    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- NeonGear CSS -->
    <link rel="stylesheet"
          href="css/style.css">


    <style>

        /* =====================================================
           MEMBER NAVBAR
        ===================================================== */

        #navbarMemberArea {
            display: flex;
            align-items: center;
        }


        #navbarMemberArea .dropdown-menu {
            min-width: 230px;
            border-radius: 14px;
            padding: 8px;
        }


        #navbarMemberArea .dropdown-item {
            border-radius: 9px;
            padding: 9px 12px;
        }


        #navbarMemberArea .dropdown-item:hover {
            background: #f1f1f1;
        }


        #navbarMemberArea .dropdown-header {
            font-weight: 700;
        }


        @media (max-width: 991px) {

            #navbarMemberArea {
                margin-top: 12px;
                padding-bottom: 8px;
            }

            #navbarMemberArea .dropdown-menu {
                width: 100%;
            }

        }


        /* =====================================================
           CONTACT FORM
        ===================================================== */

        .contact-box {
            border-radius: 20px;
        }


        .contact-box .form-control,
        .contact-box .form-select {
            border-radius: 12px;
        }


        .contact-box textarea {
            resize: vertical;
        }


        /* =====================================================
           CONTACT INFO
        ===================================================== */

        .contact-info-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 15px;
        }


        .contact-info-icon {
            font-size: 20px;
            min-width: 25px;
        }

    </style>

</head>


<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top">

    <div class="container">


        <!-- BRAND -->

        <a class="navbar-brand fw-bold text-info"

            <i class="bi bi-lightning-charge-fill"></i> NEONGEAR

        </a>


        <!-- MOBILE BUTTON -->

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- NAVIGATION -->

        <div class="collapse navbar-collapse"
             id="navbarNav">


            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item">
                    <a class="nav-link active" href="owner.html">
                        owner
                    </a>
                </li>


                <!-- HOME -->

                <li class="nav-item">

                    <a class="nav-link"
                       href="index.html">

                        Home

                    </a>

                </li>


                <!-- ABOUT -->

                <li class="nav-item">

                    <a class="nav-link"
                       href="about.html">

                        About

                    </a>

                </li>


                <!-- PRODUCTS -->

                <li class="nav-item">

                    <a class="nav-link"
                       href="products.html">

                        Products

                    </a>

                </li>


                <!-- CONTACT -->

                <li class="nav-item">

                    <a class="nav-link active"
                       href="contact.html">

                        Contact

                    </a>

                </li>
                 <a
                        class="nav-link"
                        href="my-orders.html">

                        Order History

                    </a>


                <!-- =================================================
                     LOGIN / MEMBER AREA
                ================================================= -->

                <li class="nav-item ms-lg-3">


                    <div id="navbarMemberArea">


                        <!--
                            auth.js จะเปลี่ยนส่วนนี้
                            ตามสถานะ Login
                        -->


                        <div class="d-flex gap-2">


                            <a href="login.html"
                               class="btn btn-outline-light btn-sm">

                                <i class="bi bi-box-arrow-in-right"></i>

                                เข้าสู่ระบบ

                            </a>


                        </div>


                    </div>


                </li>


            </ul>


        </div>

    </div>

</nav>



<!-- =========================================================
     CONTACT CONTENT
========================================================= -->

<div class="container py-5">


    <!-- TITLE -->

    <div class="text-center mb-5">


        <h1 class="section-title">

            Contact Us

        </h1>


        <p>

            ติดต่อ NeonGear ได้ที่นี่

        </p>


    </div>



    <div class="row g-5">


        <!-- =================================================
             CONTACT FORM
        ================================================= -->

        <div class="col-lg-7">


            <div class="contact-box">


                <h3 class="mb-4">

                    ส่งข้อความถึงเรา

                </h3>



                <form id="contactForm">


                    <!-- NAME -->

                    <div class="mb-3">


                        <label class="form-label">

                            ชื่อ-นามสกุล

                        </label>


                        <input type="text"
                               class="form-control"
                               placeholder="กรอกชื่อ-นามสกุล"
                               required>


                    </div>



                    <!-- EMAIL -->

                    <div class="mb-3">


                        <label class="form-label">

                            Email

                        </label>


                        <input type="email"
                               class="form-control"
                               placeholder="example@email.com"
                               required>


                    </div>



                    <!-- PHONE -->

                    <div class="mb-3">


                        <label class="form-label">

                            เบอร์โทรศัพท์

                        </label>


                        <input type="tel"
                               class="form-control"
                               placeholder="08X-XXX-XXXX"
                               required>


                    </div>



                    <!-- SUBJECT -->

                    <div class="mb-3">


                        <label class="form-label">

                            หัวข้อ

                        </label>


                        <select class="form-select">


                            <option>
                                สอบถามสินค้า
                            </option>


                            <option>
                                สอบถามราคา
                            </option>


                            <option>
                                แจ้งปัญหา
                            </option>


                            <option>
                                อื่น ๆ
                            </option>


                        </select>


                    </div>



                    <!-- MESSAGE -->

                    <div class="mb-3">


                        <label class="form-label">

                            รายละเอียด

                        </label>


                        <textarea class="form-control"
                                  rows="5"
                                  placeholder="พิมพ์ข้อความที่ต้องการติดต่อ..."
                                  required></textarea>


                    </div>



                    <!-- SUBMIT -->

                    <button type="submit"
                            class="btn btn-neon">

                        <i class="bi bi-send"></i>

                        ส่งข้อความ

                    </button>


                </form>


            </div>


        </div>



        <!-- =================================================
             CONTACT INFORMATION
        ================================================= -->

        <div class="col-lg-5">


            <div class="contact-box">


                <h3>

                    ติดต่อเรา

                </h3>


                <hr>



                <!-- LOCATION -->

                <div class="contact-info-item">

                    <span class="contact-info-icon">
                        📍
                    </span>

                    <span>
                        กรุงเทพฯ ประเทศไทย
                    </span>

                </div>



                <!-- EMAIL -->

                <div class="contact-info-item">

                    <span class="contact-info-icon">
                        📧
                    </span>

                    <span>
                        neongear@example.com
                    </span>

                </div>



                <!-- PHONE -->

                <div class="contact-info-item">

                    <span class="contact-info-icon">
                        ☎️
                    </span>

                    <span>
                        08X-XXX-XXXX
                    </span>

                </div>



                <!-- OPENING HOURS -->

                <div class="contact-info-item">

                    <span class="contact-info-icon">
                        🕐
                    </span>

                    <span>
                        เปิดทุกวัน 09:00 - 18:00
                    </span>

                </div>



                <!-- GOOGLE MAP -->

                <div class="ratio ratio-16x9 mt-4">


                    <iframe
                        src="https://www.google.com/maps?q=Bangkok,Thailand&output=embed"
                        style="border:0;"
                        loading="lazy"
                        allowfullscreen>

                    </iframe>


                </div>


            </div>


        </div>


    </div>

</div>

     FOOTER
========================================================= -->

<footer class="footer text-center">


    <div class="container">


        <h5 class="text-info">

           <i class="bi bi-lightning-charge-fill"></i> NEONGEAR

        </h5>


        <p>

            Gaming Gear Shop

        </p>


        <p class="small text-secondary">

            © 2026 NeonGear

        </p>
